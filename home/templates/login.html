<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>
<style>
body {
margin: 0;
padding: 0;
font-family: Arial, sans-serif;
background: #f2f2f2;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
.container {
background: white;
padding: 30px;
width: 350px;
border-radius: 10px;
box-shadow: 0 0 10px rgba(0,0,0,0.1);
text-align: center;
}
h2 { margin-bottom: 20px; }
input {
width: 100%;
padding: 12px;
margin: 10px 0;
border-radius: 5px;
border: 1px solid #ccc;
}
button {
width: 100%;
padding: 12px;
border: none;
background: #333;
color: white;
border-radius: 5px;
cursor: pointer;
margin-top: 10px;
}
a { color: #333; font-size: 14px; display: block; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
<h2>Login</h2>
<form method="post">
{% csrf_token %}
<input type="text" name="username" placeholder="Username" required />
<input type="password" name="password" placeholder="Password" required />
<button type="submit">Entrar</button>
</form>
<a href="/register">Criar conta</a>
</div>
</body>
</html>
